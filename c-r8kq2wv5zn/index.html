<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Stand</title>
  <meta name="theme-color" content="#e9e9e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d2024" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stand">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'Archivo'; src: url('fonts/archivo.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; font-display: optional; }

    :root {
      --grund: #e9e9e4;
      --text: #1c1e21;
      --text-weich: #55585d;
      --fuge: #c3c3bb;
      --takt: #9a6a00;
      --alarm: #b23a24;

      --schrift: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
      --gr-zahl: clamp(64px, 20vw, 96px);
      --gr-zahl-klein: clamp(44px, 13vw, 60px);
      --gr-titel: 20px;
      --gr-text: 16px;
      --gr-klein: 14px;
      --gr-mini: 12px;

      --r-knopf: 6px;
      --rand: 20px;
      --breite: 520px;
      --spur: 14px;
      --spur-klein: 8px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --grund: #1d2024;
        --text: #e8e6df;
        --text-weich: #a9a7a0;
        --fuge: #3a3e44;
        --takt: #e0a526;
        --alarm: #d0533c;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--grund);
      color: var(--text);
      font-family: var(--schrift);
      font-size: var(--gr-text);
      line-height: 1.45;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    h1, h2, p, ul, dl, dd { margin: 0; }
    ul { padding: 0; list-style: none; }

    .seite { max-width: var(--breite); margin: 0 auto; padding: 0 var(--rand) 48px; }

    .kopf { display: flex; align-items: baseline; gap: 12px; padding: 18px 0 14px; border-bottom: 1px solid var(--fuge); }
    .kopf h1 { font-size: var(--gr-titel); font-weight: 700; letter-spacing: -0.01em; }
    .kopf p { flex: 1; color: var(--text-weich); font-size: var(--gr-klein); }
    .knopf-leise {
      border: 1px solid var(--fuge); background: transparent; border-radius: var(--r-knopf);
      padding: 6px 12px; font-size: var(--gr-klein); cursor: pointer; min-height: 36px;
    }
    .knopf-leise:hover { border-color: var(--text-weich); }
    .knopf-leise:active { background: var(--fuge); }
    .knopf-leise[aria-busy="true"] { color: var(--text-weich); }

    .fenster { padding: 24px 0 26px; border-bottom: 1px solid var(--fuge); }
    .fenster h2 { font-size: var(--gr-text); font-weight: 600; }
    .zahl {
      font-size: var(--gr-zahl); font-weight: 700; font-stretch: 62%; line-height: 0.95;
      font-variant-numeric: tabular-nums; letter-spacing: -0.01em; margin: 6px 0 14px;
    }
    .zahl small { font-size: 0.42em; font-weight: 600; margin-left: 0.08em; }
    .fenster.klein .zahl { font-size: var(--gr-zahl-klein); margin-bottom: 10px; }
    .zeile { font-size: var(--gr-klein); margin-top: 10px; }
    .zeile + .zeile { margin-top: 4px; }
    .weich { color: var(--text-weich); }
    .vor::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--takt); margin-right: 8px; vertical-align: 1px; }

    .strip { position: relative; }
    .spur { position: relative; height: var(--spur); background: var(--fuge); }
    .klein .spur { height: var(--spur-klein); }
    .fuell { height: 100%; width: var(--w); background: var(--text); }
    .strip.voll .fuell { background: var(--alarm); }
    .takt { position: absolute; top: -6px; bottom: -22px; left: var(--x); width: 2px; margin-left: -1px; background: var(--takt); }
    .lineal { position: relative; display: flex; justify-content: space-between; margin-top: 6px; font-size: var(--gr-mini); color: var(--text-weich); font-variant-numeric: tabular-nums; }
    .lineal::before { content: ''; position: absolute; left: 0; right: 0; top: -6px; height: 4px; border-left: 1px solid var(--fuge); border-right: 1px solid var(--fuge); }

    body.erst .fuell { animation: fuellen 480ms cubic-bezier(.2, .7, .2, 1) both; }
    body.erst .takt { animation: setzen 220ms ease-out 300ms both; }
    @keyframes fuellen { from { width: 0; } }
    @keyframes setzen { from { opacity: 0; transform: translateY(-8px); } }

    .verlauf { margin-top: 22px; }
    .verlauf h3 { font-size: var(--gr-klein); font-weight: 600; margin: 0 0 8px; }
    .karte { position: relative; height: 120px; border-left: 1px solid var(--fuge); border-bottom: 1px solid var(--fuge); }
    .karte svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .karte .linie { fill: none; stroke: var(--text); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .karte .tempo { fill: none; stroke: var(--takt); stroke-width: 1.5; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
    .karte .tag { stroke: var(--fuge); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .tage { position: relative; height: 18px; margin-top: 4px; font-size: var(--gr-mini); color: var(--text-weich); }
    .tage span { position: absolute; transform: translateX(4px); }
    .legende { display: flex; gap: 16px; margin-top: 8px; font-size: var(--gr-mini); color: var(--text-weich); }
    .legende span::before { content: ''; display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--text); margin-right: 6px; vertical-align: 3px; }
    .legende .l-tempo::before { border-top: 2px dashed var(--takt); }

    .sitzungen { padding: 24px 0 8px; }
    .sitzungen h2 { font-size: var(--gr-text); font-weight: 600; }
    .sitzungen > p { font-size: var(--gr-klein); margin-top: 4px; }
    .sitzungen li { padding: 14px 0; border-bottom: 1px solid var(--fuge); }
    .s-kopf { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .s-kopf strong { font-weight: 600; overflow-wrap: anywhere; }
    .s-projekt { font-size: var(--gr-klein); color: var(--text-weich); }
    .s-kopf span { font-size: var(--gr-klein); color: var(--text-weich); white-space: nowrap; }
    .werte { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; margin-top: 10px; }
    .werte dt { font-size: var(--gr-mini); color: var(--text-weich); }
    .werte dd { font-size: var(--gr-klein); font-variant-numeric: tabular-nums; }

    .leer { padding: 32px 0; border-bottom: 1px solid var(--fuge); }
    .leer h2 { font-size: var(--gr-titel); font-weight: 700; margin-bottom: 8px; }

    .fuss { padding-top: 24px; font-size: var(--gr-klein); color: var(--text-weich); }

    @media (prefers-reduced-motion: reduce) {
      body.erst .fuell, body.erst .takt { animation: none; }
    }
  </style>
</head>
<body class="erst">
  <div class="seite">
    <header class="kopf">
      <h1>Stand</h1>
      <p id="frische" aria-live="polite"></p>
      <button type="button" class="knopf-leise" id="laden">Neu laden</button>
    </header>
    <main id="inhalt"></main>
    <footer class="fuss">
      <p>Die Werte schickt die Statuszeile von Claude Code, sobald du dort arbeitest. Nutzung in claude.ai zählt zu denselben Limits, erscheint hier aber erst mit der nächsten Messung aus Claude Code.</p>
    </footer>
  </div>

  <script>
    const API = location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://claude-stand.spanani.workers.dev';
    const H = 3600000, TAG = 24 * H;
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const uhr = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' });
    const datumUhr = new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
    const wochentag = new Intl.DateTimeFormat('de-DE', { weekday: 'short' });
    const prozent = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
    const dollar = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'USD' });

    const zeit = (t, now) => {
      const a = new Date(t), b = new Date(now);
      return a.toDateString() === b.toDateString() ? uhr.format(a) : datumUhr.format(a);
    };
    function dauer(ms) {
      const min = Math.max(0, Math.round(ms / 60000));
      if (min < 60) return `${min} min`;
      const h = Math.floor(min / 60), m = min % 60;
      if (h < 48) return m ? `${h} h ${m} min` : `${h} h`;
      return `${Math.floor(h / 24)} Tg. ${h % 24} h`;
    }
    const vor = (t, now) => now - t < 60000 ? 'gerade eben' : `vor ${dauer(now - t)}`;

    let daten = null, laeuft = false;

    function strip({ wert, start, ende, now, klein }) {
      const anteil = Math.min(1, Math.max(0, (now - start) / (ende - start)));
      const voll = wert >= 90;
      const label = `${prozent.format(wert)} Prozent verbraucht, ${prozent.format(anteil * 100)} Prozent der Zeit vergangen`;
      return `<div class="strip${voll ? ' voll' : ''}" role="img" aria-label="${label}">
        <div class="spur"><div class="fuell" style="--w:${Math.min(100, wert)}%"></div><div class="takt" style="--x:${anteil * 100}%"></div></div>
        <div class="lineal"><span>${esc(zeit(start, now))}</span><span>${esc(zeit(ende, now))}</span></div>
      </div>`;
    }

    function tempo(wert, start, ende, gemessen, now) {
      const soll = Math.min(100, Math.max(0, (gemessen - start) / (ende - start) * 100));
      const diff = Math.round(wert - soll);
      const stand = now - gemessen > 120000 ? ` Stand ${esc(zeit(gemessen, now))}.` : '';
      if (wert >= 100) return `<p class="zeile vor">Limit erreicht. Weiter geht es um ${esc(zeit(ende, now))}.${stand}</p>`;
      if (diff > 5) return `<p class="zeile vor">${diff} Punkte schneller als gleichmäßig. Bei diesem Tempo ist vor dem Reset Schluss.${stand}</p>`;
      if (diff < -5) return `<p class="zeile">${-diff} Punkte unter dem gleichmäßigen Tempo, da ist Luft.${stand}</p>`;
      return `<p class="zeile">Ziemlich genau im gleichmäßigen Tempo.${stand}</p>`;
    }

    function fenster({ titel, wert, reset, laenge, gemessen, now, klein, extra = '' }) {
      if (wert == null) return '';
      const start = reset - laenge;
      if (reset <= now) {
        return `<section class="fenster${klein ? ' klein' : ''}">
          <h2>${titel}</h2>
          <p class="zahl">0<small>%</small></p>
          <p class="zeile">Das letzte Fenster ist um ${esc(zeit(reset, now))} abgelaufen. Die nächste Nachricht startet ein neues.</p>
          ${extra}
        </section>`;
      }
      return `<section class="fenster${klein ? ' klein' : ''}">
        <h2>${titel}</h2>
        <p class="zahl">${prozent.format(wert)}<small>%</small></p>
        ${strip({ wert, start, ende: reset, now, klein })}
        <p class="zeile">Reset um ${esc(zeit(reset, now))}, in ${dauer(reset - now)}.</p>
        ${tempo(wert, start, reset, gemessen, now)}
        ${extra}
      </section>`;
    }

    function verlauf(readings, reset, now) {
      const start = reset - 7 * TAG, ende = reset;
      const punkte = readings.filter(r => r.week != null && Math.abs(r.week_reset - reset) < H && r.at >= start);
      if (punkte.length < 2) return '';
      const x = t => ((t - start) / (ende - start) * 320).toFixed(1);
      const y = v => (120 - v * 1.2).toFixed(1);
      let d = `M${x(punkte[0].at)},${y(punkte[0].week)}`;
      for (let i = 1; i < punkte.length; i++) d += `H${x(punkte[i].at)}V${y(punkte[i].week)}`;
      d += `H${x(Math.min(now, ende))}`;
      let linien = '', tage = '';
      const tag = new Date(start); tag.setHours(24, 0, 0, 0);
      for (; tag.getTime() < ende; tag.setDate(tag.getDate() + 1)) {
        const t = tag.getTime();
        linien += `<line class="tag" x1="${x(t)}" x2="${x(t)}" y1="0" y2="120"/>`;
        if (ende - t > 12 * H) tage += `<span style="left:${(t - start) / (ende - start) * 100}%">${esc(wochentag.format(t))}</span>`;
      }
      return `<div class="verlauf">
        <h3>Verlauf in diesem Fenster</h3>
        <div class="karte" role="img" aria-label="Wochenverbrauch über die Zeit, verglichen mit gleichmäßigem Tempo">
          <svg viewBox="0 0 320 120" preserveAspectRatio="none" aria-hidden="true">${linien}<line class="tempo" x1="0" y1="120" x2="320" y2="0"/><path class="linie" d="${d}"/></svg>
        </div>
        <div class="tage" aria-hidden="true">${tage}</div>
        <p class="legende"><span>Verbrauch</span><span class="l-tempo">gleichmäßiges Tempo</span></p>
      </div>`;
    }

    function ausgaben(r, now) {
      if (r.spend == null) return '';
      const zeitraum = { daily: 'Tageslimit', weekly: 'Wochenlimit', monthly: 'Monatslimit' }[r.spend_period] || 'Ausgabenlimit';
      const betrag = r.spend_usd != null && r.spend_limit != null ? `<p class="zeile">${esc(dollar.format(r.spend_usd))} von ${esc(dollar.format(r.spend_limit))} geschätzt.</p>` : '';
      return `<section class="fenster klein">
        <h2>${zeitraum}</h2>
        <p class="zahl">${prozent.format(r.spend)}<small>%</small></p>
        <div class="strip${r.spend >= 90 ? ' voll' : ''}" role="img" aria-label="${prozent.format(r.spend)} Prozent verbraucht"><div class="spur"><div class="fuell" style="--w:${Math.min(100, r.spend)}%"></div></div></div>
        ${betrag}
        ${r.spend_reset ? `<p class="zeile">Reset ${esc(zeit(r.spend_reset, now))}.</p>` : ''}
      </section>`;
    }

    function sitzungen(list, now) {
      const woche = list.filter(s => now - s.updated < 7 * TAG);
      if (!woche.length) return '';
      const summe = woche.reduce((a, s) => a + (s.cost || 0), 0);
      const zeilen = woche.slice(0, 12).map(s => {
        const werte = [
          ['Modell', s.model], ['Aufwand', s.effort], ['Version', s.version],
          ['Kosten', s.cost != null ? dollar.format(s.cost) : null],
          ['Dauer', s.duration_ms != null ? dauer(s.duration_ms) : null],
          ['Kontext', s.ctx_pct != null ? `${prozent.format(s.ctx_pct)} %` : null],
          ['Zeilen', s.added != null ? `+${s.added} / −${s.removed ?? 0}` : null],
          ['Rechenzeit', s.api_ms != null ? dauer(s.api_ms) : null],
        ].filter(([, v]) => v != null && v !== '');
        return `<li>
          <div class="s-kopf"><strong>${esc(s.name || s.project || 'Ohne Projekt')}</strong><span>${esc(vor(s.updated, now))}</span></div>
          ${s.name && s.project ? `<p class="s-projekt">${esc(s.project)}</p>` : ''}
          <dl class="werte">${werte.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
        </li>`;
      }).join('');
      return `<section class="sitzungen">
        <h2>Sitzungen der letzten 7 Tage</h2>
        <p class="weich">${woche.length} ${woche.length === 1 ? 'Sitzung' : 'Sitzungen'}, zusammen ${esc(dollar.format(summe))} geschätzte API-Kosten laut Claude Code. Im Abo werden sie nicht einzeln berechnet.</p>
        <ul>${zeilen}</ul>
      </section>`;
    }

    function zeichnen() {
      const now = Date.now();
      const inhalt = $('inhalt');
      if (!daten) return;
      const r = daten.readings[daten.readings.length - 1];
      const letzte = daten.sessions[0];
      if (!r) {
        $('frische').textContent = letzte ? `Letzte Sitzung ${vor(letzte.updated, now)}` : '';
        inhalt.innerHTML = `<section class="leer">
          <h2>Noch keine Messung</h2>
          <p class="weich">Claude Code meldet die Limits erst nach der ersten Antwort in einer Sitzung und nur mit einem Pro- oder Max-Abo. Sobald das Statuszeilen-Skript läuft, steht hier dein Stand.</p>
        </section>${sitzungen(daten.sessions, now)}`;
        return;
      }
      $('frische').textContent = `Gemessen ${now - r.at < 60000 ? 'gerade eben' : zeit(r.at, now)}`;
      inhalt.innerHTML =
        fenster({ titel: '5-Stunden-Fenster', wert: r.five, reset: r.five_reset, laenge: 5 * H, gemessen: r.at, now }) +
        fenster({ titel: 'Woche', wert: r.week, reset: r.week_reset, laenge: 7 * TAG, gemessen: r.at, now, klein: true,
          extra: r.week_reset > now ? verlauf(daten.readings, r.week_reset, now) : '' }) +
        ausgaben(r, now) +
        sitzungen(daten.sessions, now);
    }

    async function laden() {
      if (laeuft) return;
      laeuft = true;
      const knopf = $('laden');
      knopf.setAttribute('aria-busy', 'true');
      knopf.textContent = 'Lädt …';
      try {
        const res = await fetch(`${API}/state`, { cache: 'no-store' });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `Fehler ${res.status}`);
        daten = body;
        zeichnen();
        requestAnimationFrame(() => setTimeout(() => document.body.classList.remove('erst'), 800));
      } catch (e) {
        $('frische').textContent = navigator.onLine ? `Nicht erreichbar: ${e.message}` : 'Offline';
      } finally {
        laeuft = false;
        knopf.removeAttribute('aria-busy');
        knopf.textContent = 'Neu laden';
      }
    }

    $('laden').addEventListener('click', laden);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') laden(); });
    setInterval(() => { if (document.visibilityState === 'visible') laden(); }, 60000);
    setInterval(() => { if (document.visibilityState === 'visible' && !document.body.classList.contains('erst')) zeichnen(); }, 20000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    laden();
  </script>
</body>
</html>
