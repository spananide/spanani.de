<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tennis Match Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #090d16;
      --surface: #131b2e;
      --surface-light: #1e293b;
      --border: #243148;
      --player: #22c55e;
      --player-dim: rgba(34, 197, 94, 0.15);
      --opp: #f59e0b;
      --opp-dim: rgba(245, 158, 11, 0.15);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }

    .app { width: 100%; max-width: 480px; padding-bottom: 90px; }

    .header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.1rem; font-weight: 800; color: var(--text); }
    .header p { font-size: 0.75rem; color: var(--text-muted); }

    .back-btn { background: none; border: none; color: var(--player); font-weight: bold; cursor: pointer; font-size: 0.9rem; }

    .view { padding: 14px; }
    .hidden { display: none !important; }

    .match-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .match-card:active { transform: scale(0.98); }

    .match-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .match-opp { font-size: 1rem; font-weight: 700; color: var(--text); }
    .match-score-badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.85rem;
    }
    .badge-win { background-color: var(--player-dim); color: var(--player); border: 1px solid var(--player); }
    .badge-loss { background-color: var(--opp-dim); color: var(--opp); border: 1px solid var(--opp); }

    .fab {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 220px);
      width: 56px;
      height: 56px;
      background-color: var(--player);
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.4);
      cursor: pointer;
      z-index: 100;
    }
    @media (max-width: 480px) { .fab { right: 20px; } }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .card-title { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    input, select {
      width: 100%;
      padding: 12px;
      background-color: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--player);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-secondary {
      background-color: var(--surface-light);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    /* Point Tracker Controls */
    .point-tracker-box {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
    }
    .live-score { font-size: 1.8rem; font-weight: 800; color: var(--player); margin: 8px 0; }
    .point-history-pills { display: flex; gap: 4px; overflow-x: auto; padding: 6px 0; }
    .pill { background: var(--surface-light); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; }

    .point-btns { display: flex; gap: 8px; margin-top: 10px; }
    .btn-point-you { flex: 1; padding: 12px; background: var(--player-dim); border: 1px solid var(--player); color: var(--player); font-weight: bold; border-radius: 8px; cursor: pointer; }
    .btn-point-opp { flex: 1; padding: 12px; background: var(--opp-dim); border: 1px solid var(--opp); color: var(--opp); font-weight: bold; border-radius: 8px; cursor: pointer; }

    /* Counter Bar for Aces & DF */
    .counter-bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .counter-card {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .counter-card label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; font-weight: bold; }
    .counter-card .val { font-size: 1.1rem; font-weight: bold; color: var(--text); }
    .counter-card-btns { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
    .btn-mini { width: 28px; height: 28px; background: var(--surface-light); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* Timeline Grid */
    .timeline-grid { display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; }
    .timeline-col { flex: 0 0 36px; text-align: center; cursor: pointer; }
    .ball-slot { height: 24px; font-size: 0.9rem; }
    .game-bar { height: 3px; background: var(--border); margin: 2px 0; }
    .game-bar.you { background: var(--player); }
    .game-bar.opp { background: var(--opp); }
    .game-num { font-size: 0.7rem; color: var(--text-muted); }

    /* Detail Drawer Popover */
    .detail-drawer {
      background: var(--bg);
      border: 1px solid var(--player);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      position: relative;
    }

    .close-drawer-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Stats Comparison Bars */
    .stat-row { margin-bottom: 12px; }
    .stat-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }
    .stat-bar { height: 6px; background: var(--surface-light); border-radius: 3px; display: flex; overflow: hidden; }
    .fill-you { height: 100%; background: var(--player); }
    .fill-opp { height: 100%; background: var(--opp); }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div>
      <h1 id="headerTitle">Tennis Match Hub</h1>
      <p id="headerSub">Alle Spiele & Statistiken</p>
    </div>
    <button id="backBtn" class="back-btn hidden" onclick="showHome()">← Übersicht</button>
  </div>

  <!-- MAIN PAGE: MATCH HISTORIE -->
  <div id="viewHome" class="view">
    <div id="matchList"></div>
  </div>

  <!-- MATCH DETAILS VIEW -->
  <div id="viewDetail" class="view hidden">
    <button class="btn" style="margin-bottom:12px;" onclick="startNewGameForCurrentMatch()">+ NÄCHSTES SPIEL EINTRAGEN</button>

    <div class="card">
      <div class="card-title">Satzverlauf (Spiel anklicken)</div>
      <div class="timeline-grid" id="timelineGrid"></div>
      <div id="selectedGameDetail"></div>
    </div>

    <div class="card">
      <div class="card-title">Match Statistiken</div>
      <div id="statsBars"></div>
    </div>
  </div>

  <!-- NEUES MATCH VIEW -->
  <div id="viewNewMatch" class="view hidden">
    <div class="card">
      <div class="card-title">Neues Match anlegen</div>
      <input type="text" id="oppNameInput" placeholder="Gegner Name (z. B. Alex)">
      <select id="surfaceInput">
        <option value="Sandplatz">Sandplatz</option>
        <option value="Hartplatz">Hartplatz</option>
        <option value="Rasen">Rasen</option>
        <option value="Teppich">Teppich</option>
      </select>
      <button class="btn" onclick="createNewMatch()">Match Starten</button>
      <button class="btn btn-secondary" onclick="showHome()">Abbrechen</button>
    </div>
  </div>

  <!-- LIVE SPIEL & PUNKTE EINTRAGEN VIEW -->
  <div id="viewTracker" class="view hidden">
    <div class="card">
      <div class="card-title" id="trackerTitle">Spiel eintragen</div>
      
      <!-- Asse / Doppelfehler Zähler -->
      <div class="counter-bar">
        <div class="counter-card">
          <label>ASSE (DU)</label>
          <div class="val" id="valAces">0</div>
          <div class="counter-card-btns">
            <button class="btn-mini" onclick="addAce(-1)">-</button>
            <button class="btn-mini" onclick="addAce(1)">+</button>
          </div>
        </div>
        <div class="counter-card">
          <label>DOPPELFEHLER (DU)</label>
          <div class="val" id="valDF">0</div>
          <div class="counter-card-btns">
            <button class="btn-mini" onclick="addDF(-1)">-</button>
            <button class="btn-mini" onclick="addDF(1)">+</button>
          </div>
        </div>
      </div>

      <!-- Punkte-Tracker Live -->
      <div class="point-tracker-box">
        <div style="font-size:0.75rem; color:var(--text-muted);">AKTUELLER PUNKTESTAND:</div>
        <div class="live-score" id="liveScoreText">0 : 0</div>
        
        <div class="point-history-pills" id="pointPills"></div>

        <div class="point-btns">
          <button class="btn-point-you" onclick="addPoint('you')">+ Punkt DU</button>
          <button class="btn-point-opp" onclick="addPoint('opp')">+ Punkt GEGNER</button>
        </div>
      </div>

      <button class="btn" onclick="saveCurrentGame()">SPIEL SPEICHERN & ZURÜCK</button>
      <button class="btn btn-secondary" onclick="cancelCurrentGame()">Abbrechen</button>
    </div>
  </div>

  <!-- Floating Action Button -->
  <div class="fab" id="fabBtn" onclick="openNewMatchView()">+</div>

</div>

<script>
  const SUPABASE_URL = "https://DEIN-PROJECT.supabase.co";
  const SUPABASE_KEY = "DEIN-ANON-KEY";
  
  let db = null;
  if (!SUPABASE_URL.includes("DEIN-PROJECT")) {
    db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  let matches = JSON.parse(localStorage.getItem('tennis_matches_data')) || [];
  let currentMatch = null;
  let currentMatchIdx = null;
  let currentPoints = [];
  let scoreYou = 0;
  let scoreOpp = 0;
  let gameAces = 0;
  let gameDF = 0;

  function showHome() {
    document.getElementById('viewHome').classList.remove('hidden');
    document.getElementById('viewDetail').classList.add('hidden');
    document.getElementById('viewNewMatch').classList.add('hidden');
    document.getElementById('viewTracker').classList.add('hidden');
    document.getElementById('backBtn').classList.add('hidden');
    document.getElementById('fabBtn').classList.remove('hidden');
    document.getElementById('headerTitle').innerText = "Tennis Match Hub";
    document.getElementById('headerSub').innerText = "Alle Spiele & Statistiken";
    renderMatchList();
  }

  function renderMatchList() {
    const container = document.getElementById('matchList');
    container.innerHTML = '';

    if (matches.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:40px;">Noch keine Spiele eingetragen.<br/>Klicke auf <b>+</b> um ein Match zu erstellen!</p>';
      return;
    }

    matches.forEach((m, idx) => {
      const card = document.createElement('div');
      card.className = 'match-card';
      card.onclick = () => openMatchDetail(idx);
      card.innerHTML = `
        <div>
          <div class="match-meta">${m.date} • ${m.surface}</div>
          <div class="match-opp">vs. ${m.opponent}</div>
        </div>
        <div class="match-score-badge ${m.won ? 'badge-win' : 'badge-loss'}">
          ${m.won ? 'SIEG' : 'NIEDERLAGE'} (${m.scoreStr || 'Aktiv'})
        </div>
      `;
      container.appendChild(card);
    });
  }

  function openNewMatchView() {
    document.getElementById('viewHome').classList.add('hidden');
    document.getElementById('viewNewMatch').classList.remove('hidden');
    document.getElementById('backBtn').classList.remove('hidden');
    document.getElementById('fabBtn').classList.add('hidden');
  }

  function createNewMatch() {
    const opp = document.getElementById('oppNameInput').value || 'Unbekannt';
    const surface = document.getElementById('surfaceInput').value;

    currentMatch = {
      id: Date.now(),
      date: new Date().toLocaleDateString('de-DE'),
      opponent: opp,
      surface: surface,
      won: true,
      scoreStr: "Aktiv",
      games: []
    };

    matches.unshift(currentMatch);
    currentMatchIdx = 0;
    saveMatchesToStorage();

    startNewGameForCurrentMatch();
  }

  function startNewGameForCurrentMatch() {
    resetPointTracker();
    document.getElementById('viewHome').classList.add('hidden');
    document.getElementById('viewDetail').classList.add('hidden');
    document.getElementById('viewNewMatch').classList.add('hidden');
    document.getElementById('viewTracker').classList.remove('hidden');
    document.getElementById('backBtn').classList.remove('hidden');
    document.getElementById('fabBtn').classList.add('hidden');
    document.getElementById('trackerTitle').innerText = `Spiel ${currentMatch.games.length + 1} eintragen`;
  }

  const tennisScores = ["0", "15", "30", "40"];

  function addPoint(winner) {
    if (winner === 'you') scoreYou++;
    else scoreOpp++;

    let displayScore = "";

    if (scoreYou >= 3 && scoreOpp >= 3) {
      if (scoreYou === scoreOpp) displayScore = "40 : 40 (Einstand)";
      else if (scoreYou === scoreOpp + 1) displayScore = "Vorteil DU";
      else if (scoreOpp === scoreYou + 1) displayScore = "Vorteil GEGNER";
      else if (scoreYou >= scoreOpp + 2) displayScore = "SPIEL DU";
      else if (scoreOpp >= scoreYou + 2) displayScore = "SPIEL GEGNER";
    } else {
      if (scoreYou >= 4) displayScore = "SPIEL DU";
      else if (scoreOpp >= 4) displayScore = "SPIEL GEGNER";
      else displayScore = `${tennisScores[scoreYou]} : ${tennisScores[scoreOpp]}`;
    }

    currentPoints.push({ winner, scoreText: displayScore });
    updateTrackerUI(displayScore);
  }

  function addAce(delta) {
    gameAces = Math.max(0, gameAces + delta);
    document.getElementById('valAces').innerText = gameAces;
  }

  function addDF(delta) {
    gameDF = Math.max(0, gameDF + delta);
    document.getElementById('valDF').innerText = gameDF;
  }

  function updateTrackerUI(currentScoreText) {
    document.getElementById('liveScoreText').innerText = currentScoreText;
    const pills = document.getElementById('pointPills');
    pills.innerHTML = currentPoints.map(p => `<span class="pill">${p.scoreText}</span>`).join('');
  }

  function resetPointTracker() {
    scoreYou = 0;
    scoreOpp = 0;
    gameAces = 0;
    gameDF = 0;
    currentPoints = [];
    document.getElementById('valAces').innerText = "0";
    document.getElementById('valDF').innerText = "0";
    updateTrackerUI("0 : 0");
  }

  function saveCurrentGame() {
    if (currentPoints.length === 0) {
      alert("Trage zuerst Punkte für das Spiel ein.");
      return;
    }

    const gameWinner = scoreYou > scoreOpp ? 'you' : 'opp';
    currentMatch.games.push({
      gameNum: currentMatch.games.length + 1,
      winner: gameWinner,
      aces: gameAces,
      df: gameDF,
      points: [...currentPoints]
    });

    saveMatchesToStorage();
    openMatchDetail(currentMatchIdx);
  }

  function cancelCurrentGame() {
    if (currentMatch && currentMatch.games.length > 0) {
      openMatchDetail(currentMatchIdx);
    } else {
      showHome();
    }
  }

  function saveMatchesToStorage() {
    localStorage.setItem('tennis_matches_data', JSON.stringify(matches));
    if (db && currentMatch) {
      db.from('matches').upsert([currentMatch]).then();
    }
  }

  function openMatchDetail(idx) {
    currentMatchIdx = idx;
    currentMatch = matches[idx];

    document.getElementById('viewHome').classList.add('hidden');
    document.getElementById('viewTracker').classList.add('hidden');
    document.getElementById('viewDetail').classList.remove('hidden');
    document.getElementById('backBtn').classList.remove('hidden');
    document.getElementById('fabBtn').classList.add('hidden');
    
    document.getElementById('headerTitle').innerText = `vs. ${currentMatch.opponent}`;
    document.getElementById('headerSub').innerText = `${currentMatch.date} • ${currentMatch.surface}`;

    const grid = document.getElementById('timelineGrid');
    grid.innerHTML = '';
    
    currentMatch.games.forEach((g) => {
      const col = document.createElement('div');
      col.className = 'timeline-col';
      col.onclick = () => showGamePoints(g);
      col.innerHTML = `
        <div class="ball-slot">${g.winner === 'you' ? '🎾' : ''}</div>
        <div class="game-bar ${g.winner}"></div>
        <div class="game-num">${g.gameNum}</div>
        <div class="ball-slot">${g.winner === 'opp' ? '🎾' : ''}</div>
      `;
      grid.appendChild(col);
    });

    closeGamePoints();

    // Calculate Stats
    const gamesYou = currentMatch.games.filter(g => g.winner === 'you').length;
    const gamesOpp = currentMatch.games.filter(g => g.winner === 'opp').length;
    const totalAces = currentMatch.games.reduce((acc, g) => acc + (g.aces || 0), 0);
    const totalDF = currentMatch.games.reduce((acc, g) => acc + (g.df || 0), 0);
    
    document.getElementById('statsBars').innerHTML = `
      ${renderStatRow('Gewonnene Spiele', gamesYou, gamesOpp)}
      ${renderStatRow('Asse (DU)', totalAces, 0)}
      ${renderStatRow('Doppelfehler (DU)', totalDF, 0)}
    `;
  }

  function showGamePoints(game) {
    const detail = document.getElementById('selectedGameDetail');
    detail.innerHTML = `
      <div class="detail-drawer">
        <button class="close-drawer-btn" onclick="closeGamePoints()">✕ Schließen</button>
        <b>Spiel ${game.gameNum} (${game.winner === 'you' ? 'Gewonnen' : 'Verloren'}):</b><br/>
        <span style="font-size:0.75rem; color:var(--text-muted);">
          Asse: ${game.aces || 0} | Doppelfehler: ${game.df || 0}
        </span>
        <div style="display:flex; gap:4px; overflow-x:auto; margin-top:6px;">
          ${game.points.map(p => `<span class="pill">${p.scoreText}</span>`).join('')}
        </div>
      </div>
    `;
  }

  function closeGamePoints() {
    document.getElementById('selectedGameDetail').innerHTML = '';
  }

  function renderStatRow(title, valYou, valOpp) {
    const total = valYou + valOpp || 1;
    const pctYou = Math.round((valYou / total) * 100);
    const pctOpp = Math.round((valOpp / total) * 100);
    return `
      <div class="stat-row">
        <div class="stat-header"><span>${valYou}</span><span>${title}</span><span>${valOpp}</span></div>
        <div class="stat-bar">
          <div class="fill-you" style="width:${pctYou}%"></div>
          <div class="fill-opp" style="width:${pctOpp}%"></div>
        </div>
      </div>
    `;
  }

  if (db) {
    db.from('matches').select('*').then(res => {
      if (res.data && res.data.length > 0) {
        matches = res.data;
        renderMatchList();
      }
    });
  } else {
    renderMatchList();
  }
</script>

</body>
</html>
