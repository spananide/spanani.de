name: Deploy claude-stand

on:
  push:
    branches: [main]
    paths:
      - 'workers/claude-stand/**'
      - 'workers/tonne-push/src/push.js'
      - 'workers/tonne-push/src/common.js'
      - '.github/workflows/claude-stand.yml'
  workflow_dispatch:

concurrency:
  group: claude-stand
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/claude-stand
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.151.2
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen in den Repository-Secrets."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22

      - name: D1 database
        if: steps.check.outputs.ok == 'true'
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "claude-stand-db") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create claude-stand-db
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "claude-stand-db") | .uuid')
          fi
          test -n "$id"
          sed -i "s/REPLACE_WITH_ID_FROM_wrangler_d1_create/$id/" wrangler.jsonc
          $WRANGLER d1 migrations apply claude-stand-db --remote

      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        run: $WRANGLER deploy

      - name: VAPID keys
        if: steps.check.outputs.ok == 'true'
        run: |
          if $WRANGLER secret list --format json | jq -e '.[] | select(.name == "VAPID_PRIVATE")' > /dev/null; then
            echo "VAPID keys already set"
            exit 0
          fi
          keys=$(node ../tonne-push/keys.mjs)
          pub=$(printf '%s\n' "$keys" | sed -n 's/^VAPID_PUBLIC *= *//p')
          priv=$(printf '%s\n' "$keys" | sed -n 's/^VAPID_PRIVATE *= *//p')
          echo "::add-mask::$priv"
          test -n "$pub" && test -n "$priv"
          printf '%s' "$pub" | $WRANGLER secret put VAPID_PUBLIC
          printf '%s' "$priv" | $WRANGLER secret put VAPID_PRIVATE

      - name: Smoke test
        if: steps.check.outputs.ok == 'true'
        run: |
          sleep 5
          curl -fsS https://claude-stand.spanani.workers.dev/state | jq -e '.readings | type == "array"'
          curl -fsS https://claude-stand.spanani.workers.dev/key | jq -e '.key | startswith("B")'
