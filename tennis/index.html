<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tennis Match Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #121214;
      --card-elevated: #1c1c1e;
      --border: #2c2c2e;
      --border-subtle: #1f1f22;
      --accent: #ccff00; /* Tennis Volt */
      --accent-dim: rgba(204, 255, 0, 0.12);
      --accent-opp: #ff9500;
      --accent-opp-dim: rgba(255, 149, 0, 0.12);
      --text: #ffffff;
      --text-muted: #8e8e93;
      --text-dim: #636366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; font-variant-numeric: tabular-nums; }

    .app { width: 100%; max-width: 440px; min-height: 100vh; display: flex; flex-direction: column; }

    /* Navigation Bar */
    .nav {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(18, 18, 20, 0.85);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .nav-title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
    .nav-sub { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .btn-nav { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 0; }

    .view { padding: 16px; flex: 1; }
    .hidden { display: none !important; }

    /* Match List (Home) */
    .match-row {
      background: var(--card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .match-row:active { background: var(--card-elevated); }
    .match-meta { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
    .match-players { font-size: 15px; font-weight: 600; }
    .match-score {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 6px 12px;
      border-radius: 8px;
    }

    /* Floating New Button */
    .btn-fab {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 200px);
      width: 52px;
      height: 52px;
      border-radius: 26px;
      background: var(--accent);
      color: #000;
      font-size: 24px;
      font-weight: 700;
      border: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    @media (max-width: 440px) { .btn-fab { right: 20px; } }

    /* Cards & Containers */
    .section-box {
      background: var(--card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    /* Form Fields */
    .field { margin-bottom: 12px; }
    .input {
      width: 100%;
      height: 44px;
      background: var(--card-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 0 12px;
      outline: none;
    }
    .input:focus { border-color: var(--accent); }

    /* Buttons */
    .btn-primary {
      width: 100%;
      height: 48px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:active { opacity: 0.85; }
    .btn-ghost {
      width: 100%;
      height: 40px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Segmented Control (Server Selection) */
    .seg-control {
      display: flex;
      background: var(--card-elevated);
      padding: 3px;
      border-radius: 9px;
      margin-bottom: 14px;
    }
    .seg-btn {
      flex: 1;
      height: 32px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
    }
    .seg-btn.active-you { background: var(--card); color: var(--accent); }
    .seg-btn.active-opp { background: var(--card); color: var(--accent-opp); }

    /* Live Score Display */
    .live-card {
      background: var(--card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      margin-bottom: 12px;
    }
    .live-score {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #fff;
      margin: 4px 0 12px 0;
    }
    .score-pills {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      justify-content: center;
      padding: 4px 0;
      min-height: 28px;
    }
    .pill {
      font-size: 11px;
      font-weight: 700;
      background: var(--card-elevated);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
    }

    /* Point Touch Targets */
    .point-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 48px;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn-point {
      height: 64px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .btn-point.you { background: var(--accent); color: #000; }
    .btn-point.opp { background: var(--card-elevated); color: #fff; border: 1px solid var(--border); }
    .btn-point span { font-size: 11px; font-weight: 500; opacity: 0.8; }
    .btn-undo {
      height: 64px;
      background: var(--card-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
    }

    /* Server Stats Counter */
    .stepper-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stepper-card {
      flex: 1;
      background: var(--card-elevated);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stepper-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .stepper-controls { display: flex; align-items: center; gap: 8px; }
    .stepper-val { font-size: 14px; font-weight: 700; min-width: 14px; text-align: center; }
    .stepper-btn {
      width: 26px;
      height: 26px;
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Timeline Bar Grid */
    .timeline {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 6px 0;
    }
    .game-node {
      flex: 0 0 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 0;
    }
    .node-slot { height: 20px; font-size: 10px; font-weight: 800; display: flex; align-items: center; }
    .node-bar { width: 100%; height: 3px; background: var(--border); border-radius: 1px; margin: 3px 0; }
    .node-bar.you { background: var(--accent); }
    .node-bar.opp { background: var(--accent-opp); }
    .node-num { font-size: 10px; color: var(--text-dim); font-weight: 700; }

    /* Comparison Bars */
    .h2h-row { margin-bottom: 12px; }
    .h2h-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .h2h-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .h2h-track { height: 4px; background: var(--card-elevated); border-radius: 2px; display: flex; overflow: hidden; gap: 1px; }
    .h2h-fill-you { background: var(--accent); height: 100%; }
    .h2h-fill-opp { background: var(--accent-opp); height: 100%; }

    /* Clean Detail Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-sheet {
      width: 100%;
      max-width: 440px;
      background: #18181b;
      border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      padding: 20px 16px 32px 16px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-close { background: var(--card-elevated); border: none; color: #fff; width: 28px; height: 28px; border-radius: 14px; font-size: 12px; cursor: pointer; }

    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-chip { background: var(--card); border: 1px solid var(--border-subtle); padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    .stat-chip-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .stat-chip-val { font-size: 13px; font-weight: 700; margin-top: 2px; }

    .point-feed {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 4px;
      background: var(--card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
    }
    .point-node { flex: 0 0 54px; text-align: center; }
    .point-node-slot { height: 18px; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .point-node-bar { height: 3px; background: var(--border); border-radius: 1px; margin: 3px 0; }
    .point-node-tag { font-size: 11px; font-weight: 800; background: var(--card-elevated); padding: 2px 4px; border-radius: 4px; margin: 2px 0; }
  </style>
</head>
<body>

<div class="app">

  <!-- Header Navigation -->
  <header class="nav">
    <div>
      <div class="nav-title" id="navTitle">Matches</div>
      <div class="nav-sub" id="navSub">Übersicht</div>
    </div>
    <button class="btn-nav hidden" id="btnBack" onclick="navigate('home')">Zurück</button>
  </header>

  <!-- VIEW 1: MATCH-LISTE -->
  <main id="viewHome" class="view">
    <div id="matchList"></div>
    <button class="btn-fab" onclick="navigate('new-match')">+</button>
  </main>

  <!-- VIEW 2: MATCH-DETAILS -->
  <main id="viewDetail" class="view hidden">
    <button class="btn-primary" style="margin-bottom: 14px;" onclick="startNewGame()">+ Nächstes Spiel erfassen</button>

    <div class="section-box">
      <div class="section-label">
        <span>Satzverlauf</span>
        <span style="color: var(--accent);">■ DU &nbsp; <span style="color: var(--accent-opp);">■ GEGNER</span></span>
      </div>
      <div class="timeline" id="matchTimeline"></div>
    </div>

    <div class="section-box">
      <div class="section-label">Statistiken</div>
      <div id="h2hStats"></div>
    </div>
  </main>

  <!-- VIEW 3: NEUES MATCH -->
  <main id="viewNewMatch" class="view hidden">
    <div class="section-box">
      <div class="section-label">Neues Spiel anlegen</div>
      <div class="field">
        <input class="input" id="inputOpp" type="text" placeholder="Gegner Name (z. B. Alex)">
      </div>
      <div class="field">
        <select class="input" id="inputSurface">
          <option value="Sandplatz">Sandplatz</option>
          <option value="Hartplatz">Hartplatz</option>
          <option value="Rasen">Rasen</option>
          <option value="Teppich">Teppich</option>
        </select>
      </div>
      <button class="btn-primary" onclick="createMatch()">Match Starten</button>
      <button class="btn-ghost" onclick="navigate('home')">Abbrechen</button>
    </div>
  </main>

  <!-- VIEW 4: LIVE GAME TRACKER -->
  <main id="viewTracker" class="view hidden">
    <!-- Server Segmented Control -->
    <div class="seg-control">
      <button class="seg-btn active-you" id="srvBtnYou" onclick="setServer('you')">Aufschlag: DU</button>
      <button class="seg-btn" id="srvBtnOpp" onclick="setServer('opp')">Aufschlag: GEGNER</button>
    </div>

    <!-- Dynamic Server Stats -->
    <div class="stepper-row">
      <div class="stepper-card">
        <span class="stepper-label">Asse</span>
        <div class="stepper-controls">
          <button class="stepper-btn" onclick="updateCounter('aces', -1)">-</button>
          <span class="stepper-val" id="valAces">-</span>
          <button class="stepper-btn" onclick="updateCounter('aces', 1)">+</button>
        </div>
      </div>
      <div class="stepper-card">
        <span class="stepper-label">Doppelfehler</span>
        <div class="stepper-controls">
          <button class="stepper-btn" onclick="updateCounter('df', -1)">-</button>
          <span class="stepper-val" id="valDf">-</span>
          <button class="stepper-btn" onclick="updateCounter('df', 1)">+</button>
        </div>
      </div>
    </div>

    <!-- Live Score Center -->
    <div class="live-card">
      <div style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 700;">Punktestand</div>
      <div class="live-score" id="liveScore">0 - 0</div>
      <div class="score-pills" id="scorePills"></div>
    </div>

    <!-- Touch Actions -->
    <div class="point-grid">
      <button class="btn-point you" onclick="addPoint('you')">
        DU <span>+ Punkt</span>
      </button>
      <button class="btn-point opp" onclick="addPoint('opp')">
        GEGNER <span>+ Punkt</span>
      </button>
      <button class="btn-undo" onclick="undoPoint()" title="Punkt zurück">↩</button>
    </div>

    <button class="btn-primary" onclick="saveGame()">Spiel Speichern</button>
    <button class="btn-ghost" onclick="cancelTracker()">Abbrechen</button>
  </main>

  <!-- MODAL: GAME DETAIL -->
  <div class="modal-backdrop hidden" id="gameModal" onclick="if(event.target === this) closeModal();">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Spiel 1</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>

      <div class="modal-stats">
        <div class="stat-chip">
          <div class="stat-chip-label">Aufschlag</div>
          <div class="stat-chip-val" id="modalServer">DU</div>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-label">Ergebnis</div>
          <div class="stat-chip-val" id="modalResult">HOLD</div>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-label">Asse</div>
          <div class="stat-chip-val" id="modalAces">-</div>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-label">Doppelfehler</div>
          <div class="stat-chip-val" id="modalDf">-</div>
        </div>
      </div>

      <div class="section-label" style="margin-top: 16px;">Ballwechsel Verlauf</div>
      <div class="point-feed" id="modalFeed"></div>
    </div>
  </div>

</div>

<script>
  // SUPABASE CONFIG
  const SUPABASE_URL = "https://DEIN-PROJECT.supabase.co";
  const SUPABASE_KEY = "DEIN-ANON-KEY";
  let db = (!SUPABASE_URL.includes("DEIN-PROJECT")) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  // Global State
  let matches = JSON.parse(localStorage.getItem('tennis_app_v6')) || [];
  let currentMatch = null;
  let currentMatchIdx = null;

  // Tracker State
  let currentServer = 'you';
  let scoreYou = 0;
  let scoreOpp = 0;
  let pointsList = [];
  let statAces = null;
  let statDf = null;

  function navigate(view) {
    document.querySelectorAll('main').forEach(el => el.classList.add('hidden'));
    document.getElementById('btnBack').classList.toggle('hidden', view === 'home');

    if (view === 'home') {
      document.getElementById('viewHome').classList.remove('hidden');
      document.getElementById('navTitle').innerText = 'Matches';
      document.getElementById('navSub').innerText = `${matches.length} Gespeichert`;
      renderMatchList();
    } else if (view === 'detail') {
      document.getElementById('viewDetail').classList.remove('hidden');
      document.getElementById('navTitle').innerText = `vs. ${currentMatch.opponent}`;
      document.getElementById('navSub').innerText = `${currentMatch.date} • ${currentMatch.surface}`;
      renderDetailView();
    } else if (view === 'new-match') {
      document.getElementById('viewNewMatch').classList.remove('hidden');
      document.getElementById('navTitle').innerText = 'Neues Match';
      document.getElementById('navSub').innerText = 'Setup';
    } else if (view === 'tracker') {
      document.getElementById('viewTracker').classList.remove('hidden');
      document.getElementById('navTitle').innerText = `Spiel ${currentMatch.games.length + 1}`;
      document.getElementById('navSub').innerText = 'Live Erfassung';
    }
  }

  function renderMatchList() {
    const list = document.getElementById('matchList');
    list.innerHTML = '';

    if (matches.length === 0) {
      list.innerHTML = '<div style="text-align:center; color:var(--text-dim); padding:40px 0; font-size:13px;">Keine Matches vorhanden.<br/>Tippe auf +, um ein neues Spiel zu starten.</div>';
      return;
    }

    matches.forEach((m, idx) => {
      const won = m.games.filter(g => g.winner === 'you').length;
      const lost = m.games.filter(g => g.winner === 'opp').length;
      
      const row = document.createElement('div');
      row.className = 'match-row';
      row.onclick = () => {
        currentMatchIdx = idx;
        currentMatch = matches[idx];
        navigate('detail');
      };
      row.innerHTML = `
        <div>
          <div class="match-meta">${m.date} • ${m.surface}</div>
          <div class="match-players">vs. ${m.opponent}</div>
        </div>
        <div class="match-score">${won} : ${lost}</div>
      `;
      list.appendChild(row);
    });
  }

  function createMatch() {
    const opp = document.getElementById('inputOpp').value.trim() || 'Gegner';
    const surface = document.getElementById('inputSurface').value;

    currentMatch = {
      id: Date.now(),
      date: new Date().toLocaleDateString('de-DE'),
      opponent: opp,
      surface: surface,
      games: []
    };

    matches.unshift(currentMatch);
    currentMatchIdx = 0;
    saveMatches();
    startNewGame();
  }

  function startNewGame() {
    scoreYou = 0;
    scoreOpp = 0;
    pointsList = [];
    statAces = null;
    statDf = null;
    updateCounterUI();
    updateScoreUI('0 - 0');

    // Alternating server logic
    if (currentMatch.games.length === 0) {
      setServer('you');
    } else {
      const prev = currentMatch.games[currentMatch.games.length - 1].server;
      setServer(prev === 'you' ? 'opp' : 'you');
    }

    navigate('tracker');
  }

  function setServer(role) {
    currentServer = role;
    document.getElementById('srvBtnYou').className = `seg-btn ${role === 'you' ? 'active-you' : ''}`;
    document.getElementById('srvBtnOpp').className = `seg-btn ${role === 'opp' ? 'active-opp' : ''}`;
  }

  function updateCounter(type, delta) {
    if (type === 'aces') {
      if (statAces === null) statAces = delta > 0 ? 1 : 0;
      else statAces = Math.max(0, statAces + delta);
    } else {
      if (statDf === null) statDf = delta > 0 ? 1 : 0;
      else statDf = Math.max(0, statDf + delta);
    }
    updateCounterUI();
  }

  function updateCounterUI() {
    document.getElementById('valAces').innerText = statAces === null ? '-' : statAces;
    document.getElementById('valDf').innerText = statDf === null ? '-' : statDf;
  }

  const scores = ["0", "15", "30", "40"];

  function addPoint(win) {
    if (win === 'you') scoreYou++;
    else scoreOpp++;

    let display = "";
    if (scoreYou >= 3 && scoreOpp >= 3) {
      if (scoreYou === scoreOpp) display = "40 - 40";
      else if (scoreYou === scoreOpp + 1) display = "AD - 40";
      else if (scoreOpp === scoreYou + 1) display = "40 - AD";
      else display = "GAME";
    } else {
      if (scoreYou >= 4 || scoreOpp >= 4) display = "GAME";
      else display = `${scores[scoreYou]} - ${scores[scoreOpp]}`;
    }

    pointsList.push({ winner: win, tag: display, sy: scoreYou, so: scoreOpp });
    updateScoreUI(display);
  }

  function undoPoint() {
    if (pointsList.length === 0) return;
    pointsList.pop();
    if (pointsList.length > 0) {
      const prev = pointsList[pointsList.length - 1];
      scoreYou = prev.sy;
      scoreOpp = prev.so;
      updateScoreUI(prev.tag);
    } else {
      scoreYou = 0;
      scoreOpp = 0;
      updateScoreUI('0 - 0');
    }
  }

  function updateScoreUI(scoreText) {
    document.getElementById('liveScore').innerText = scoreText;
    const pills = document.getElementById('scorePills');
    pills.innerHTML = pointsList.map(p => `<span class="pill">${p.tag}</span>`).join('');
  }

  function saveGame() {
    if (pointsList.length === 0) return alert("Erfasse zuerst mindestens einen Punkt.");

    const win = scoreYou > scoreOpp ? 'you' : 'opp';
    currentMatch.games.push({
      gameNum: currentMatch.games.length + 1,
      server: currentServer,
      winner: win,
      aces: statAces,
      df: statDf,
      points: [...pointsList]
    });

    saveMatches();
    navigate('detail');
  }

  function cancelTracker() {
    if (currentMatch.games.length > 0) navigate('detail');
    else navigate('home');
  }

  function renderDetailView() {
    const timeline = document.getElementById('matchTimeline');
    timeline.innerHTML = '';

    if (currentMatch.games.length === 0) {
      timeline.innerHTML = '<div style="font-size:12px; color:var(--text-dim); padding:10px 0;">Keine Spiele erfasst.</div>';
    } else {
      currentMatch.games.forEach((g) => {
        const node = document.createElement('div');
        node.className = 'game-node';
        node.onclick = () => openModal(g);
        node.innerHTML = `
          <div class="node-slot">${g.winner === 'you' ? '●' : ''}</div>
          <div class="node-bar ${g.winner}"></div>
          <div class="node-num">${g.gameNum}</div>
          <div class="node-slot">${g.winner === 'opp' ? '●' : ''}</div>
        `;
        timeline.appendChild(node);
      });
    }

    renderH2H();
  }

  function renderH2H() {
    const g = currentMatch.games;
    const wonY = g.filter(x => x.winner === 'you').length;
    const wonO = g.filter(x => x.winner === 'opp').length;
    const brkY = g.filter(x => x.winner === 'you' && x.server === 'opp').length;
    const brkO = g.filter(x => x.winner === 'opp' && x.server === 'you').length;
    const aceY = g.filter(x => x.server === 'you').reduce((a, x) => a + (x.aces || 0), 0);
    const aceO = g.filter(x => x.server === 'opp').reduce((a, x) => a + (x.aces || 0), 0);
    const dfY = g.filter(x => x.server === 'you').reduce((a, x) => a + (x.df || 0), 0);
    const dfO = g.filter(x => x.server === 'opp').reduce((a, x) => a + (x.df || 0), 0);

    const stats = document.getElementById('h2hStats');
    stats.innerHTML = `
      ${renderH2HRow('Spiele', wonY, wonO)}
      ${renderH2HRow('Breaks', brkY, brkO)}
      ${renderH2HRow('Asse', aceY, aceO)}
      ${renderH2HRow('Doppelfehler', dfY, dfO)}
    `;
  }

  function renderH2HRow(label, vy, vo) {
    const tot = vy + vo || 1;
    const py = Math.round((vy / tot) * 100);
    const po = Math.round((vo / tot) * 100);
    return `
      <div class="h2h-row">
        <div class="h2h-meta">
          <span style="color: var(--accent);">${vy}</span>
          <span class="h2h-label">${label}</span>
          <span style="color: var(--accent-opp);">${vo}</span>
        </div>
        <div class="h2h-track">
          <div class="h2h-fill-you" style="width: ${py}%;"></div>
          <div class="h2h-fill-opp" style="width: ${po}%;"></div>
        </div>
      </div>
    `;
  }

  function openModal(game) {
    const isBreak = game.server !== game.winner;
    document.getElementById('modalTitle').innerText = `Spiel ${game.gameNum}`;
    document.getElementById('modalServer').innerText = game.server === 'you' ? 'DU' : 'GEGNER';
    document.getElementById('modalResult').innerText = isBreak ? 'BREAK' : 'HOLD';
    document.getElementById('modalAces').innerText = game.aces ?? '-';
    document.getElementById('modalDf').innerText = game.df ?? '-';

    const feed = document.getElementById('modalFeed');
    feed.innerHTML = '';

    game.points.forEach((pt) => {
      const node = document.createElement('div');
      node.className = 'point-node';
      node.innerHTML = `
        <div class="point-node-slot">${pt.winner === 'you' ? '●' : ''}</div>
        <div class="point-node-bar" style="background:${pt.winner === 'you' ? 'var(--accent)' : 'var(--accent-opp)'}"></div>
        <div class="point-node-tag">${pt.tag}</div>
        <div class="point-node-slot">${pt.winner === 'opp' ? '●' : ''}</div>
      `;
      feed.appendChild(node);
    });

    document.getElementById('gameModal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('gameModal').classList.add('hidden');
  }

  function saveMatches() {
    localStorage.setItem('tennis_app_v6', JSON.stringify(matches));
    if (db && currentMatch) db.from('matches').upsert([currentMatch]).then();
  }

  // Init
  if (db) {
    db.from('matches').select('*').then(res => {
      if (res.data && res.data.length > 0) matches = res.data;
      navigate('home');
    });
  } else {
    navigate('home');
  }
</script>

</body>
</html>
