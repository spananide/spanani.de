name: Deploy claude-stand

on:
  push:
    branches: [main]
    paths:
      - 'workers/claude-stand/**'
      - '.github/workflows/claude-stand.yml'
  workflow_dispatch:

concurrency:
  group: claude-stand
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/claude-stand
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAND_TOKEN: ${{ secrets.CLAUDE_STAND_TOKEN }}
      WRANGLER: npx --yes wrangler@4.151.2
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$STAND_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID und CLAUDE_STAND_TOKEN müssen in den Repository-Secrets stehen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22

      - name: D1 database
        if: steps.check.outputs.ok == 'true'
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "claude-stand-db") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create claude-stand-db
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "claude-stand-db") | .uuid')
          fi
          test -n "$id"
          sed -i "s/REPLACE_WITH_ID_FROM_wrangler_d1_create/$id/" wrangler.jsonc
          $WRANGLER d1 migrations apply claude-stand-db --remote

      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        run: |
          $WRANGLER deploy
          printf '%s' "$STAND_TOKEN" | $WRANGLER secret put TOKEN

      - name: Smoke test
        if: steps.check.outputs.ok == 'true'
        run: |
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' https://claude-stand.spanani.workers.dev/state)" = 401
